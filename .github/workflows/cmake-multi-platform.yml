name: Multi-platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= Linux 构建 (x64) =================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # 加上 patchelf 用于修改 rpath
          sudo apt-get install -y build-essential cmake libsdl2-dev patchelf
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(nproc)
          
      - name: Smoke Test
        run: |
          cd build/bin
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package (Fix Dynamic Libs & RPATH)
        run: |
          cd build/bin
          # 1. 剔除无用二进制
          rm -f sense-voice-quantize sense-voice-zcr-main
          
          # 2. 拷贝 Linux 下必需的底层动态库
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 .
          cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 .
          
          # 3. 用 patchelf 设置 RPATH 为 $ORIGIN，让程序去当前目录找 .so
          patchelf --set-rpath '$ORIGIN' sense-voice-stream
          patchelf --set-rpath '$ORIGIN' sense-voice-main
          
          # 4. 打包
          tar -czvf ../../sensevoice-linux-x64.tar.gz *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-linux-x64
          path: sensevoice-linux-x64.tar.gz

  # ================= macOS 构建 (ARM64) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # 关键修复：必须安装 sdl2，否则 CMake 会跳过 stream
        run: brew install cmake sdl2
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(sysctl -n hw.ncpu)
          
      - name: Smoke Test
        run: |
          cd build/bin
          # 断言：如果没有 stream，直接让 CI 失败
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package (Fix Dylib Paths & Cleanup)
        run: |
          cd build/bin
          # 1. 剔除无用二进制
          rm -f sense-voice-quantize sense-voice-zcr-main
          
          # 2. 拷贝 SDL2 dylib
          SDL2_PATH=$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib
          cp $SDL2_PATH .
          
          # 3. 修改 dylib 的加载路径为当前目录 (@executable_path)
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib libSDL2-2.0.0.dylib
          install_name_tool -change $SDL2_PATH @executable_path/libSDL2-2.0.0.dylib sense-voice-stream
          # 如果 main 也链接了 SDL2，也一并修改
          install_name_tool -change $SDL2_PATH @executable_path/libSDL2-2.0.0.dylib sense-voice-main || true
          
          # 4. 打包 (过滤掉构建残留文件)
          zip -r ../../sensevoice-macos-arm64.zip sense-voice-* *.dylib
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-macos-arm64
          path: sensevoice-macos-arm64.zip

  # ================= Windows 构建 (x64) =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            base-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-SDL2
            zip
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Program Files/Git/bin:/c/Program Files/Git/cmd"
          git submodule sync && git submodule update --init --recursive
          
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-DSDL_MAIN_HANDLED" -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          
          sed -i 's/-mwindows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--subsystem,windows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--undefined=WinMain//g' build/build.ninja
          sed -i 's/[^ ]*libSDL2main\.a//g' build/build.ninja
          sed -i 's/-lSDL2main//g' build/build.ninja
          
          cmake --build build
          
      - name: Package
        shell: msys2 {0}
        run: |
          # 1. 剔除无用二进制
          rm -f build/bin/sense-voice-quantize.exe
          rm -f build/bin/sense-voice-zcr-main.exe
          
          # 2. 精准提取运行库
          cp /clang64/bin/libc++.dll build/bin/
          cp /clang64/bin/libunwind.dll build/bin/
          cp /clang64/bin/libwinpthread-1.dll build/bin/
          cp /clang64/bin/libomp.dll build/bin/
          cp /clang64/bin/SDL2.dll build/bin/
          
          cd build/bin
          zip -r ../../sensevoice-windows-x64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-windows-x64
          path: sensevoice-windows-x64.zip

  # ================= 发布 Release =================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
