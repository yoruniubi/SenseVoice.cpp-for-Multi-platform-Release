name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 推送 v 开头的 tag 时触发构建+发布
  pull_request:
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write      # 允许创建 Release 并上传资产

jobs:
  # ──────────────────────────────────────────────
  # Linux x86_64
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build -j $(nproc)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-linux-amd64
          path: build/bin/

  # ──────────────────────────────────────────────
  # macOS (Apple Silicon / Intel)
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(sysctl -n hw.ncpu)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-macos
          path: build/bin/

  # ──────────────────────────────────────────────
  # Windows x64
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-windows-x64
          path: build/bin/Release/

  # ──────────────────────────────────────────────
  # Release：仅在推送 v* tag 时执行
  # ──────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts          # 所有 artifact 按名称下载到子目录

      - name: List artifacts (debug)
        run: find artifacts -type f

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sensevoice-linux-amd64/**/*
            artifacts/sensevoice-macos/**/*
            artifacts/sensevoice-windows-x64/**/*
          draft: false
          prerelease: false
