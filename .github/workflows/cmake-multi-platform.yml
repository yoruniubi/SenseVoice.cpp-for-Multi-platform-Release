name: Multi-platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= Linux 构建 (x64) =================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev patchelf
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(nproc)
          
      - name: Smoke Test
        run: |
          cd build/bin
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package
        run: |
          export WORKSPACE=${{ github.workspace }}
          mkdir -p $WORKSPACE/release_pkg
          
          cd $WORKSPACE/build/bin
          patchelf --set-rpath '$ORIGIN' sense-voice-stream
          patchelf --set-rpath '$ORIGIN' sense-voice-main
          
          # 使用绝对路径拷贝，彻底避免路径错误
          cp sense-voice-main sense-voice-stream $WORKSPACE/release_pkg/
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 $WORKSPACE/release_pkg/
          cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 $WORKSPACE/release_pkg/
          
          cd $WORKSPACE/release_pkg
          tar -czvf $WORKSPACE/sensevoice-linux-x64.tar.gz *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-linux-x64
          path: sensevoice-linux-x64.tar.gz

  # ================= macOS 构建 (ARM64) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake sdl2
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(sysctl -n hw.ncpu)
          
      - name: Smoke Test
        run: |
          cd build/bin
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package
        run: |
          export WORKSPACE=${{ github.workspace }}
          mkdir -p $WORKSPACE/release_pkg
          SDL2_LIB=$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib
          
          cd $WORKSPACE/build/bin
          install_name_tool -change $SDL2_LIB @executable_path/libSDL2-2.0.0.dylib sense-voice-stream
          install_name_tool -change $SDL2_LIB @executable_path/libSDL2-2.0.0.dylib sense-voice-main || true
          
          # 使用绝对路径拷贝
          cp sense-voice-main sense-voice-stream $WORKSPACE/release_pkg/
          cp $SDL2_LIB $WORKSPACE/release_pkg/
          
          cd $WORKSPACE/release_pkg
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib libSDL2-2.0.0.dylib
          zip -r $WORKSPACE/sensevoice-macos-arm64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-macos-arm64
          path: sensevoice-macos-arm64.zip

  # ================= Windows 构建 (x64) =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            base-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-SDL2
            zip
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Program Files/Git/bin:/c/Program Files/Git/cmd"
          git submodule sync && git submodule update --init --recursive
          
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-DSDL_MAIN_HANDLED" -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          
          sed -i 's/-mwindows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--subsystem,windows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--undefined=WinMain//g' build/build.ninja
          sed -i 's/[^ ]*libSDL2main\.a//g' build/build.ninja
          sed -i 's/-lSDL2main//g' build/build.ninja
          
          cmake --build build
          
      - name: Package
        shell: msys2 {0}
        run: |
          export WORKSPACE=$(cygpath -u "${{ github.workspace }}")
          mkdir -p $WORKSPACE/release_pkg
          
          # 使用绝对路径拷贝
          cp $WORKSPACE/build/bin/sense-voice-main.exe $WORKSPACE/release_pkg/
          cp $WORKSPACE/build/bin/sense-voice-stream.exe $WORKSPACE/release_pkg/
          
          cp /clang64/bin/libc++.dll $WORKSPACE/release_pkg/
          cp /clang64/bin/libunwind.dll $WORKSPACE/release_pkg/
          cp /clang64/bin/libwinpthread-1.dll $WORKSPACE/release_pkg/
          cp /clang64/bin/libomp.dll $WORKSPACE/release_pkg/
          cp /clang64/bin/SDL2.dll $WORKSPACE/release_pkg/
          
          cd $WORKSPACE/release_pkg
          zip -r $WORKSPACE/sensevoice-windows-x64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-windows-x64
          path: sensevoice-windows-x64.zip

  # ================= 发布 Release =================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
