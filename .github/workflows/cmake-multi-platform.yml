name: Multi-platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= Linux 构建 (x64) =================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev patchelf
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          # ⑤ 确认加上 -DGGML_NATIVE=OFF
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(nproc)
          
      - name: Smoke Test
        run: |
          cd build/bin
          # ① 断言 stream 存在
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package
        run: |
          mkdir -p release_pkg
          cd build/bin
          
          # ② 拷贝依赖库
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 release_pkg/ || cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 .
          cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 release_pkg/ || cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 .
          
          # ② patchelf 修改 rpath
          patchelf --set-rpath '$ORIGIN' sense-voice-stream
          patchelf --set-rpath '$ORIGIN' sense-voice-main
          
          # ③ 白名单拷贝：只拿主程序和流式程序，以及刚才放的动态库
          cp sense-voice-main sense-voice-stream *.so* release_pkg/
          
          # 打包
          cd release_pkg
          tar -czvf ../../sensevoice-linux-x64.tar.gz *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-linux-x64
          path: sensevoice-linux-x64.tar.gz

  # ================= macOS 构建 (ARM64) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # ① 安装 sdl2
        run: brew install cmake sdl2
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          # ⑤ 确认加上 -DGGML_NATIVE=OFF
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(sysctl -n hw.ncpu)
          
      - name: Smoke Test
        run: |
          cd build/bin
          # ① 断言 stream 存在
          test -f sense-voice-stream || { echo "Error: stream missing!"; exit 1; }
          chmod +x sense-voice-stream sense-voice-main
          ./sense-voice-stream --help || true
          
      - name: Package
        run: |
          mkdir -p release_pkg
          cd build/bin
          
          # ④ 获取 SDL2 路径并拷贝
          SDL2_LIB=$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib
          cp $SDL2_LIB release_pkg/
          
          # ④ 修改动态库加载路径 (install_name_tool)
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib release_pkg/libSDL2-2.0.0.dylib
          install_name_tool -change $SDL2_LIB @executable_path/libSDL2-2.0.0.dylib sense-voice-stream
          install_name_tool -change $SDL2_LIB @executable_path/libSDL2-2.0.0.dylib sense-voice-main || true
          
          # ③ 白名单拷贝
          cp sense-voice-main sense-voice-stream release_pkg/
          
          # 打包
          cd release_pkg
          zip -r ../../sensevoice-macos-arm64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-macos-arm64
          path: sensevoice-macos-arm64.zip

  # ================= Windows 构建 (x64) =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            base-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-SDL2
            zip
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Program Files/Git/bin:/c/Program Files/Git/cmd"
          git submodule sync && git submodule update --init --recursive
          
          # ⑤ 确认加上 -DGGML_NATIVE=OFF 防止非法指令崩溃
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-DSDL_MAIN_HANDLED" -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          
          sed -i 's/-mwindows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--subsystem,windows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--undefined=WinMain//g' build/build.ninja
          sed -i 's/[^ ]*libSDL2main\.a//g' build/build.ninja
          sed -i 's/-lSDL2main//g' build/build.ninja
          
          cmake --build build
          
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p release_pkg
          
          # ③ 白名单拷贝：只拿主程序、流式程序
          cp build/bin/sense-voice-main.exe release_pkg/
          cp build/bin/sense-voice-stream.exe release_pkg/
          
          # 提取必需运行库
          cp /clang64/bin/libc++.dll release_pkg/
          cp /clang64/bin/libunwind.dll release_pkg/
          cp /clang64/bin/libwinpthread-1.dll release_pkg/
          cp /clang64/bin/libomp.dll release_pkg/
          cp /clang64/bin/SDL2.dll release_pkg/
          
          cd release_pkg
          zip -r ../../sensevoice-windows-x64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-windows-x64
          path: sensevoice-windows-x64.zip

  # ================= 发布 Release =================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
