name: Multi-platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= Linux 构建 =================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          # 加上 -DBUILD_SHARED_LIBS=OFF 强制静态链接
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(nproc)
      - name: Package
        run: |
          cd build/bin
          tar -czvf ../../sensevoice-linux-amd64.tar.gz *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-linux-amd64
          path: sensevoice-linux-amd64.tar.gz

  # ================= macOS 构建 =================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake
      - name: Build
        run: |
          git submodule sync && git submodule update --init --recursive
          # 加上 -DBUILD_SHARED_LIBS=OFF 强制静态链接
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j $(sysctl -n hw.ncpu)
      - name: Package
        run: |
          cd build/bin
          zip -r ../../sensevoice-macos.zip *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-macos
          path: sensevoice-macos.zip

  # ================= Windows 构建 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            base-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-SDL2
            zip
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Program Files/Git/bin:/c/Program Files/Git/cmd"
          git submodule sync && git submodule update --init --recursive
          
          # 加上 -DBUILD_SHARED_LIBS=OFF 和 -DSDL_MAIN_HANDLED
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-DSDL_MAIN_HANDLED" -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          
          # 修改 Ninja 文件，剔除 SDL2main 和 GUI 标志
          sed -i 's/-mwindows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--subsystem,windows/-Wl,--subsystem,console/g' build/build.ninja
          sed -i 's/-Wl,--undefined=WinMain//g' build/build.ninja
          sed -i 's/[^ ]*libSDL2main\.a//g' build/build.ninja
          sed -i 's/-lSDL2main//g' build/build.ninja
          
          cmake --build build
          
      - name: Package
        shell: msys2 {0}
        run: |
          # 只需要复制 SDL2.dll，ggml 已经是静态编译进去了
          cp /clang64/bin/SDL2.dll build/bin/
          cd build/bin
          zip -r ../../sensevoice-windows-x64.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensevoice-windows-x64
          path: sensevoice-windows-x64.zip

  # ================= 发布 Release =================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
